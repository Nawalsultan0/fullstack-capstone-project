version: '3.8'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "3060:3060"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=giftdb
      - JWT_SECRET=change_this_secret
    depends_on:
      - mongo

volumes:
  mongo-data:
